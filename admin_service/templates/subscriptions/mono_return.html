<!doctype html>
<html lang="{{ html_lang|default:'uk' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
      :root {
        --bg: #f6f3ec;
        --card: #fffdf8;
        --text: #1f2421;
        --muted: #657071;
        --accent: #16a085;
        --accent-dark: #0f766e;
        --warn: #f59e0b;
        --danger: #dc2626;
        --shadow: 0 18px 48px rgba(16, 24, 40, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(22, 160, 133, 0.14), transparent 32%),
          radial-gradient(circle at bottom right, rgba(245, 158, 11, 0.12), transparent 26%),
          var(--bg);
        color: var(--text);
      }

      main {
        width: min(100%, 620px);
        padding: 36px 32px;
        border-radius: 28px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        margin: 0 0 14px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .eyebrow.failure {
        color: var(--danger);
      }

      .eyebrow.processing {
        color: var(--warn);
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(34px, 7vw, 56px);
        line-height: 0.98;
      }

      .message {
        margin: 0;
        font-size: 20px;
        line-height: 1.5;
        color: var(--muted);
      }

      .actions {
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 16px 24px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: #fff;
        text-decoration: none;
        font-size: 18px;
        font-weight: 700;
      }

      .hint {
        margin-top: 16px;
        font-size: 15px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow {{ tone }}">{{ eyebrow }}</p>
      <h1>{{ title }}</h1>
      <p class="message">{{ message|linebreaksbr }}</p>
      <div class="actions">
        <a class="button" href="{{ bot_url }}" target="_blank" rel="noopener noreferrer">{{ open_bot_label|default:"Відкрити бота" }}</a>
      </div>
      <p class="hint">{{ open_bot_hint|default:"Якщо бот уже відкритий, просто поверніться в Telegram і дочекайтеся оновлення статусу." }}</p>
    </main>
  </body>
</html>
